name: Native NATS tests

on:
  push:
  pull_request:

concurrency:
  group: native-nats-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-nats:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build golang-go \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Bootstrap vcpkg
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --no-tags origin 4f326c4072038c8624c36a8ba5ed23f616adda53
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ github.workspace }}/build-ci/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install NATS server
        run: go install github.com/nats-io/nats-server/v2@v2.14.3

      - name: Configure
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DKITCHEN_SINK_WITH_NATS_ASIO=ON

      - name: Build
        run: cmake --build build-ci -j2

      - name: Run native tests with local NATS
        env:
          NATS_SERVER_BIN: /home/runner/go/bin/nats-server
          NATS_ASIO_E2E_PORT: 4222
        run: |
          "$NATS_SERVER_BIN" -p 4222 >"$RUNNER_TEMP/nats-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          ctest --test-dir build-ci --output-on-failure
